name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated town art and map are up to date
        run: |
          pnpm --filter @hearth/client town
          git diff --exit-code -- apps/client/public/tiles/town.png packages/shared/maps
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start local Supabase
        run: pnpm db:start
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: local-dev-placeholder
      - run: pnpm test:db
      - run: pnpm --filter @hearth/client exec playwright install --with-deps chromium
      - run: pnpm --filter @hearth/client build:demo
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client/playwright-report
